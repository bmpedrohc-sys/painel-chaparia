<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14171c">
<title>Painel de Produção — Chaparia</title>
<style>
  :root{
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-2: #20252d;
    --line: #2b313b;
    --text: #eceef1;
    --text-dim: #8b93a1;
    --text-faint: #5b6270;
    --ok: #4caf7d;
    --ok-bg: rgba(76,175,125,0.14);
    --warn: #e8a33d;
    --warn-bg: rgba(232,163,61,0.14);
    --crit: #e5484d;
    --crit-bg: rgba(229,72,77,0.14);
    --accent: #4c7ea8;
    --accent-bg: rgba(76,126,168,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    min-height:100%; min-height:100dvh; overscroll-behavior:none;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  .num{font-variant-numeric:tabular-nums;}
  #app{min-height:100vh; min-height:100dvh; background:var(--bg);}

  header.top{
    display:flex; flex-direction:column; gap:16px;
    padding:22px 28px 20px; border-bottom:1px solid var(--line);
  }
  .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;}
  header.top h1{font-size:19px; font-weight:600; margin:0 0 4px;}
  header.top .sub{font-size:13px; color:var(--text-dim); margin:0 0 8px;}
  .date-field{display:flex; align-items:center; gap:8px;}
  .date-field label{font-size:11px; color:var(--text-faint); font-weight:600;}
  .date-field input[type=date]{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    color:var(--text); padding:5px 8px; font-size:12.5px; font-family:inherit;
  }
  .brand{display:inline-flex; align-items:center; flex:none;}
  .brand-logo{height:28px; width:auto; display:block;}
  .brand-fallback{
    font-size:15px; font-weight:700; letter-spacing:0.04em; color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:4px 10px;
  }

  .summary-groups{display:flex; gap:14px; flex-wrap:wrap;}
  .summary-group{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; display:flex; flex-direction:column; gap:8px;
    min-width:230px; flex:1;
  }
  .summary-group-name{font-size:12.5px; color:var(--text); font-weight:600;}
  .summary-row{display:flex; gap:20px;}
  .summary-item{text-align:left;}
  .summary-item .label{font-size:10.5px; color:var(--text-faint); margin-bottom:2px;}
  .summary-item .value{font-size:19px; font-weight:700;}
  .sfer-group{border-color:var(--accent);}
  .sfer-input{
    width:90px; font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); padding:3px 6px;
  }

  .shift-bar{display:flex; gap:8px; padding:14px 28px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .shift-tab{
    background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .shift-tab .range{display:block; font-weight:400; font-size:11px; color:var(--text-faint); margin-top:2px;}
  .shift-tab.active{border-color:var(--accent); color:var(--accent); background:var(--accent-bg);}
  .shift-tab.day-tab{border-style:dashed;}
  .shift-tab.day-tab.active{border-color:var(--warn); color:var(--warn); background:var(--warn-bg); border-style:solid;}
  .shift-tab.active .range{color:var(--accent);}

  .filter-bar{display:flex; align-items:center; gap:8px; padding:10px 28px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .filter-label{font-size:11px; color:var(--text-faint); font-weight:600; margin-right:2px;}
  .chip{
    background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    padding:6px 11px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .chip b{font-variant-numeric:tabular-nums; font-weight:700;}
  .chip.active.ok{border-color:var(--ok); color:var(--ok); background:var(--ok-bg);}
  .chip.active.warn{border-color:var(--warn); color:var(--warn); background:var(--warn-bg);}
  .chip.active.crit{border-color:var(--crit); color:var(--crit); background:var(--crit-bg);}
  .chip.active.hour{border-color:var(--accent); color:var(--accent); background:var(--accent-bg);}
  .chip.clear{color:var(--text-faint); border-style:dashed;}
  .filter-hint{font-size:11.5px; color:var(--text-faint); font-style:italic;}

  .pareto-panel{
    margin:14px 28px 0; padding:14px 16px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px;
  }
  .pareto-toggle-row{margin:14px 28px 0;}
  .pareto-toggle-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .pareto-toggle-btn:hover{border-color:var(--text-dim); color:var(--text);}
  .pareto-title{font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:10px;}
  .pareto-row{display:grid; grid-template-columns:220px 1fr 190px; align-items:center; gap:10px; padding:5px 6px; font-size:12px; cursor:pointer; border-radius:6px;}
  .pareto-row:hover{background:rgba(255,255,255,0.04);}
  .pareto-row.active{background:var(--accent-bg); outline:1px solid var(--accent);}
  .pareto-row.active .pareto-label{color:var(--accent); font-weight:700;}
  .chip.active.motivo{border-color:var(--accent); color:var(--accent); background:var(--accent-bg);}
  .pareto-label{color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pareto-count{color:var(--text-faint); font-size:10.5px;}
  .pareto-barwrap{height:10px; background:#2b313b; border-radius:5px; overflow:hidden;}
  .pareto-bar{height:100%; background:var(--crit); border-radius:5px;}
  .pareto-nums{color:var(--text-dim); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .pareto-acum{color:var(--text-faint); margin-left:4px;}
  @media (max-width: 720px){
    .pareto-row{grid-template-columns:1fr; gap:4px;}
    .pareto-nums{text-align:left;}
  }

  .stopped-min{font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:4px;}

  .hourcol{cursor:pointer; border-radius:5px; transition:opacity .15s;}
  .hourcol.dimmed{opacity:0.28;}
  .hourcol.selected .hourlabel{color:var(--accent); font-weight:700;}

  main{padding:22px 28px 60px;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:16px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 16px 14px; display:flex; flex-direction:column; gap:12px;
  }
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-head .titles{min-width:0;}
  .card-head h3{font-size:14.5px; font-weight:600; margin:0 0 4px; line-height:1.3;}
  .tag{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
    font-weight:600;
  }
  .tag.principal{background:var(--accent-bg); color:var(--accent);}
  .tag.estoque{background:var(--warn-bg); color:var(--warn);}
  .tag.jph-tag{background:#2b313b; color:var(--text-dim); margin-left:6px; font-variant-numeric:tabular-nums;}
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    width:28px; height:28px; border-radius:7px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .icon-btn:hover{border-color:var(--text-dim); color:var(--text);}

  .totals{display:flex; gap:18px; align-items:baseline;}
  .totals .block .label{font-size:11px; color:var(--text-faint);}
  .totals .block .value{font-size:22px; font-weight:700;}
  .value .unit{font-size:11px; font-weight:600; color:var(--text-faint);}
  .delta{font-size:12px; font-weight:600; padding:3px 8px; border-radius:6px; margin-left:auto; align-self:center;}
  .delta.ok{color:var(--ok); background:var(--ok-bg);}
  .delta.warn{color:var(--warn); background:var(--warn-bg);}
  .delta.crit{color:var(--crit); background:var(--crit-bg);}

  .chart{display:flex; align-items:flex-end; gap:5px; height:74px; border-bottom:1px solid var(--line); padding-bottom:2px; overflow-x:auto;}
  .hourcol{display:flex; flex-direction:column; align-items:center; flex:1; min-width:16px; height:100%; justify-content:flex-end; gap:2px;}
  .bars{display:flex; gap:2px; align-items:flex-end; height:100%; width:100%; justify-content:center;}
  .bar{width:7px; border-radius:2px 2px 0 0;}
  .bar.prev{background:#3a4150;}
  .bar.real{}
  .bar.real.ok{background:var(--ok);}
  .bar.real.warn{background:var(--warn);}
  .bar.real.crit{background:var(--crit);}
  .bar.real.pending{background:#2b313b;}
  .hourlabel{font-size:9px; color:var(--text-faint); white-space:nowrap;}

  .stockwrap{font-size:12.5px; display:flex; align-items:center; gap:12px; color:var(--text-dim); flex-wrap:wrap;}
  .stocklabel{font-size:11px; color:var(--text-faint); font-weight:600;}
  .stockpair{display:flex; gap:16px;}
  .stockitem{display:flex; flex-direction:column; gap:1px;}
  .stocktag{font-size:10px; color:var(--text-faint);}
  .stocknum{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stocknum.ok{color:var(--ok);}
  .stocknum.warn{color:var(--warn);}
  .stocknum.crit{color:var(--crit);}
  .stockdelta{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stockdelta.down{color:var(--crit);}
  .stockdelta.up{color:var(--ok);}
  .stockdelta.flat{color:var(--text-dim);}
  .stockmin{font-size:11px; color:var(--text-faint); margin-left:auto;}

  .card-foot{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .btn{
    border:none; border-radius:7px; padding:8px 12px; font-size:12.5px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn.perdas{background:var(--crit-bg); color:var(--crit);}
  .btn.perdas:hover{background:rgba(229,72,77,0.24);}
  .count-pill{background:var(--crit); color:#fff; border-radius:10px; font-size:11px; padding:0 6px; min-width:16px; text-align:center;}
  .justif{font-size:11px; color:var(--text-dim);}
  .justif.done{color:var(--ok);}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,12,15,0.66);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    width:100%; max-width:560px; max-height:86vh; overflow-y:auto;
    padding:20px 22px 22px;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
  .modal-head h2{font-size:16px; margin:0 0 3px;}
  .modal-head .sub{font-size:12px; color:var(--text-dim); margin:0;}
  .close-btn{background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1;}
  .close-btn:hover{color:var(--text);}

  table.data{width:100%; border-collapse:collapse; margin-top:14px; font-size:13px;}
  table.data th{text-align:left; color:var(--text-faint); font-size:11px; font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line);}
  table.data td{padding:6px 6px; border-bottom:1px solid var(--line);}
  table.data input[type=number], table.data input[type=text]{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:5px;
    color:var(--text); padding:5px 6px; font-size:13px;
  }
  table.data input.prev-locked{
    border-color:var(--warn); background:rgba(232,163,61,0.08);
  }
  table.data input.prev-locked:disabled{
    border-color:var(--line); background:var(--panel-2); color:var(--text-faint); cursor:not-allowed;
  }
  table.data input.prev-locked:not(:disabled){
    border-color:var(--ok); background:rgba(76,175,125,0.08);
  }
  .lock-btn{
    background:none; border:none; cursor:pointer; font-size:13px; margin-left:4px; vertical-align:middle;
  }
  .pwd-bar{
    display:flex; align-items:center; gap:8px; margin-top:10px; padding:10px 12px;
    background:var(--panel); border:1px solid var(--warn); border-radius:8px; font-size:12.5px; color:var(--text-dim);
  }
  .pwd-bar input[type=password]{
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px; color:var(--text);
    padding:6px 8px; font-size:13px; width:130px;
  }
  select.reason{background:var(--panel); border:1px solid var(--line); border-radius:5px; color:var(--text); padding:6px; font-size:13px;}
  .rm-btn{background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:15px;}
  .rm-btn:hover{color:var(--crit);}

  .addrow{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:flex-end;}
  .addrow-hint{font-size:10.5px; color:var(--text-faint); margin-top:6px; font-style:italic;}
  .addrow > div{display:flex; flex-direction:column; gap:3px;}
  .addrow label{font-size:10.5px; color:var(--text-faint);}
  .addrow input, .addrow select{background:var(--panel); border:1px solid var(--line); border-radius:6px; color:var(--text); padding:7px 8px; font-size:13px;}
  .addrow input[name=qtd]{width:70px;}
  .addrow input[name=hora]{width:110px;}
  .addbtn{background:var(--accent-bg); color:var(--accent); border:none; border-radius:6px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .addbtn:hover{background:rgba(76,126,168,0.24);}

  .stock-edit-grid{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-top:12px;}
  .stock-edit-grid div{display:flex; flex-direction:column; gap:4px;}
  .stock-edit-grid label{font-size:11px; color:var(--text-faint);}
  .stock-edit-grid input{background:var(--panel); border:1px solid var(--line); border-radius:6px; color:var(--text); padding:7px 8px; font-size:13px;}
  .jph-edit{display:flex; align-items:center; gap:10px; margin:14px 0 4px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; flex-wrap:wrap;}
  .jph-edit label{font-size:12px; color:var(--text-dim); font-weight:600;}
  .jph-edit input{width:90px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; color:var(--text); padding:6px 8px; font-size:13px;}
  .jph-hint{font-size:10.5px; color:var(--text-faint); font-style:italic;}

  .banner{font-size:12px; padding:9px 12px; border-radius:7px; margin-top:14px; display:flex; justify-content:space-between; gap:10px;}
  .banner.done{background:var(--ok-bg); color:var(--ok);}
  .banner.pending{background:var(--warn-bg); color:var(--warn);}

  .shared-note{font-size:11px; color:var(--text-faint); margin-top:16px; border-top:1px solid var(--line); padding-top:10px;}
  .backup-row{display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .backup-btn{
    background:var(--accent-bg); color:var(--accent); border:none; border-radius:6px;
    padding:6px 12px; font-size:11.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center;
  }
  .backup-btn:hover{background:rgba(76,126,168,0.24);}
  .loading{padding:60px; text-align:center; color:var(--text-dim); font-size:13px;}
  .reset-link{background:none; border:none; color:var(--text-faint); font-size:11px; cursor:pointer; text-decoration:underline; padding:0;}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando painel…</div></div>

<script>
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ---- Turnos ----
const SHIFTS = [
  { id:'t1', label:'1° Turno', start:'06:00', end:'15:48' },
  { id:'t2', label:'2° Turno', start:'15:48', end:'01:09' },
  { id:'t3', label:'3° Turno', start:'01:09', end:'06:00' },
];

function timeToMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minutesToLabel(m){
  m = ((m%1440)+1440)%1440;
  const h=Math.floor(m/60), mm=m%60;
  return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}

// Dia de produção: o "dia X" contém os 3 turnos, mesmo que o 3° turno
// aconteça no relógio já na madrugada do dia calendário seguinte.
// 1° turno dia X: 06:00–15:48 (mesmo dia calendário)
// 2° turno dia X: 15:48–01:09 (começa no dia X, termina já no dia calendário seguinte)
// 3° turno dia X: 01:09–06:00 — mas ocorre no relógio na madrugada do dia calendário
//                 seguinte ao dia X; por isso, se agora são, por ex., 03:00,
//                 o turno 3 em andamento pertence ao dia de produção de ONTEM.
function fmtDate(dateObj){
  return dateObj.getFullYear()+'-'+String(dateObj.getMonth()+1).padStart(2,'0')+'-'+String(dateObj.getDate()).padStart(2,'0');
}
function addDays(dateObj, n){
  const d = new Date(dateObj.getTime());
  d.setDate(d.getDate()+n);
  return d;
}
function getProductionDayAndShift(now){
  now = now || new Date();
  const minutesNow = now.getHours()*60 + now.getMinutes();
  const t1Start = timeToMinutes('06:00'); // 360
  const t2Start = timeToMinutes('15:48'); // 948
  const t3Start = timeToMinutes('01:09'); // 69

  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = addDays(today, -1);

  if(minutesNow >= t1Start && minutesNow < t2Start){
    return { date: fmtDate(today), shift: 't1' };
  }
  if(minutesNow >= t2Start){ // 15:48 até 23:59 — 2° turno do dia de hoje
    return { date: fmtDate(today), shift: 't2' };
  }
  if(minutesNow < t3Start){ // 00:00 até 01:09 — ainda é o fim do 2° turno de ONTEM
    return { date: fmtDate(yesterday), shift: 't2' };
  }
  // 01:09 até 06:00 — 3° turno, mas pertence ao dia de produção de ONTEM
  return { date: fmtDate(yesterday), shift: 't3' };
}
// divide um turno em blocos de até 1h, respeitando início/fim exatos (mesmo com minutos quebrados)
function genBuckets(startStr, endStr){
  let start = timeToMinutes(startStr);
  let end = timeToMinutes(endStr);
  if(end<=start) end += 1440; // turno cruza a meia-noite
  const buckets=[];
  let cur=start;
  while(cur<end){
    let next = Math.floor(cur/60+1)*60;
    if(next>end) next=end;
    buckets.push({ from:cur, to:next, minutes: next-cur, label: minutesToLabel(cur)+'–'+minutesToLabel(next) });
    cur=next;
  }
  return buckets;
}
// encontra o índice do bloco HxH do turno em que um horário (hh:mm) cai
function findHxHBucketIndex(shiftId, timeStr){
  const shift = SHIFTS.find(s=>s.id===shiftId);
  if(!shift || !timeStr) return -1;
  const shiftStart = timeToMinutes(shift.start);
  let t = timeToMinutes(timeStr);
  if(t < shiftStart) t += 1440; // horário cai já no dia seguinte (turno cruza a meia-noite)
  const buckets = genBuckets(shift.start, shift.end);
  for(let i=0;i<buckets.length;i++){ if(t >= buckets[i].from && t < buckets[i].to) return i; }
  return buckets.length ? buckets.length-1 : -1;
}
function findHxHBucket(shiftId, timeStr){
  const idx = findHxHBucketIndex(shiftId, timeStr);
  if(idx<0) return '—';
  const shift = SHIFTS.find(s=>s.id===shiftId);
  const buckets = genBuckets(shift.start, shift.end);
  return buckets[idx] ? buckets[idx].label : '—';
}
// gera previsto proporcional ao tamanho do bloco, e realizado simulado para as primeiras ~60% das horas do turno
function genShiftHours(shift, targetPerHour, quality){
  const buckets = genBuckets(shift.start, shift.end);
  const elapsed = Math.max(1, Math.ceil(buckets.length*0.6));
  const base = quality==='good' ? 0.97 : quality==='warn' ? 0.87 : 0.70;
  const wiggle = [0,-0.02,0.02,-0.01,0.01,0.03,-0.03,0.015,-0.015,0.02,-0.02];
  return buckets.map((b,i)=>{
    const prev = Math.max(1, Math.round(targetPerHour*(b.minutes/60)));
    const ratio = Math.max(0.4, base + wiggle[i % wiggle.length]);
    const real = i<elapsed ? Math.round(prev*ratio) : 0;
    return { h:b.label, prev, real, durMin:b.minutes };
  });
}

function makeSampleLoss(minutos, motivo, qtd){
  const horaInicio = SHIFTS[0].start;
  const horaFim = minutesToLabel(timeToMinutes(horaInicio) + minutos);
  const hxh = findHxHBucket(SHIFTS[0].id, horaInicio);

}

/* ================================================================
   CAMADA DE DADOS — Supabase com fallback local
   ================================================================
   Grava UM registro por LINHA por DIA na tabela "painel_dados".
   Assim, dois team leaders editando linhas diferentes ao mesmo
   tempo nunca sobrescrevem o trabalho um do outro.
   ================================================================ */

const SUPABASE_CONFIG = {
  // Supabase → Project Settings → API Keys (chave sb_publishable_... ou a anon eyJ...)
  url: 'https://vxqmxmciliswuaqfamap.supabase.co',
  anonKey: 'sb_publishable_wZ3u6N6VAYUxJlIT0_uHtw_LmT9Dt63',
  table: 'painel_dados'
};

function supabaseConfigured(){
  return SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey
    && SUPABASE_CONFIG.url.indexOf('SEU-PROJETO') < 0
    && SUPABASE_CONFIG.anonKey.indexOf('SUA-ANON-KEY') < 0;
}

const SupabaseStore = {
  name: 'supabase',
  _base(){ return SUPABASE_CONFIG.url.replace(/\/+$/,'') + '/rest/v1/' + SUPABASE_CONFIG.table; },
  _headers(extra){
    const h = {'apikey': SUPABASE_CONFIG.anonKey, 'Content-Type': 'application/json'};
    // chave antiga (anon, começa com eyJ) também vai no Authorization; a nova (sb_publishable_) só no apikey
    if(SUPABASE_CONFIG.anonKey.indexOf('eyJ') === 0) h['Authorization'] = 'Bearer ' + SUPABASE_CONFIG.anonKey;
    return Object.assign(h, extra || {});
  },
  async ping(){
    const r = await fetch(this._base() + '?select=chave&limit=1', {headers:this._headers()});
    if(!r.ok) throw new Error('Supabase ' + r.status);
  },
  async get(key){
    const r = await fetch(this._base() + '?select=chave,dados,atualizado_em&chave=eq.' + encodeURIComponent(key) + '&limit=1',
      {headers:this._headers()});
    if(!r.ok) throw new Error('Supabase get ' + r.status);
    const rows = await r.json();
    return rows[0] ? {key, value:rows[0].dados, modified:rows[0].atualizado_em} : null;
  },
  async set(key, value){
    const r = await fetch(this._base() + '?on_conflict=chave', {
      method:'POST',
      headers:this._headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify({chave:key, dados:value, atualizado_em:new Date().toISOString()})
    });
    if(!r.ok) throw new Error('Supabase set ' + r.status);
    return {key, value};
  },
  // Cache local: { chave: {ts, dados} }. A cada sincronização baixa só
  // chave + data de atualização (poucos bytes) e busca o conteúdo apenas
  // das linhas que mudaram — economiza a franquia de tráfego do Supabase.
  _cache: {},
  async _fetchRows(query){
    const out = [];
    const pageSize = 1000;
    for(let from = 0; ; from += pageSize){
      const r = await fetch(this._base() + query,
        {headers:this._headers({'Range-Unit':'items', 'Range': from + '-' + (from + pageSize - 1)})});
      if(!r.ok) throw new Error('Supabase ' + r.status);
      const rows = await r.json();
      out.push.apply(out, rows);
      if(rows.length < pageSize) break;
    }
    return out;
  },
  async getMany(prefix){
    const like = 'chave=like.' + encodeURIComponent(prefix + '*');
    const index = await this._fetchRows('?select=chave,atualizado_em&' + like + '&order=chave');
    const stale = index.filter(r => !this._cache[r.chave] || this._cache[r.chave].ts !== r.atualizado_em).map(r => r.chave);
    for(let i = 0; i < stale.length; i += 50){
      const chunk = stale.slice(i, i + 50).map(k => '"' + k.replace(/"/g, '') + '"').join(',');
      const rows = await this._fetchRows('?select=chave,dados,atualizado_em&chave=in.(' + encodeURIComponent(chunk) + ')');
      rows.forEach(r => { this._cache[r.chave] = {ts:r.atualizado_em, dados:r.dados}; });
    }
    const out = {};
    index.forEach(r => { if(this._cache[r.chave]) out[r.chave] = this._cache[r.chave].dados; });
    return out;
  },
  async list(prefix){ return { keys: Object.keys(await this.getMany(prefix)) }; }
};

const LocalStore = {
  name: 'local',
  async get(key){ const v = localStorage.getItem(key); return v===null ? null : {key, value:v}; },
  async set(key, value){ localStorage.setItem(key, value); return {key, value}; },
  async getMany(prefix){
    const out = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(prefix)===0) out[k] = localStorage.getItem(k);
    }
    return out;
  },
  async list(prefix){ return { keys: Object.keys(await this.getMany(prefix)) }; }
};

let Store = supabaseConfigured() ? SupabaseStore : LocalStore;

// Se o Supabase estiver inacessível (sem internet, tabela não criada, chave errada),
// cai para armazenamento local para o painel não ficar inutilizável.
async function ensureStoreHealthy(){
  if(Store.name !== 'supabase') return;
  try{
    await Store.ping();
  }catch(e){
    console.warn('Supabase indisponível, usando armazenamento local:', e.message);
    Store = LocalStore;
  }
}

/* ---- Chaves: um item por linha, por dia ---- */
const DATA_PREFIX = 'chaparia-v6-';
function dayPrefix(dateStr){ return DATA_PREFIX + dateStr + '-'; }
function lineKey(dateStr, lineId){ return dayPrefix(dateStr) + 'line-' + lineId; }
function sferKeyForDate(dateStr){ return dayPrefix(dateStr) + 'sfer'; }

let lineSnapshots = {}; // lineId -> JSON salvo por último (para detectar mudança externa)

function stripSublinhaPrefix(lines){
  if(!lines) return lines;
  lines.forEach(l=>{
    if(l.name && l.name.indexOf('Sublinha — ')===0) l.name = l.name.slice('Sublinha — '.length);
    if(l.name && l.name.indexOf('Main Line — ')===0) l.name = l.name.slice('Main Line — '.length);
  });
  return lines;
}

/* ---- Migração do formato antigo (blob único v5) ---- */
async function migrateV5IfNeeded(dateStr){
  try{
    const old = await Store.get('chaparia-linhas-v5-' + dateStr);
    if(!old || !old.value) return null;
    const lines = stripSublinhaPrefix(JSON.parse(old.value));
    for(const l of lines){
      await Store.set(lineKey(dateStr, l.id), JSON.stringify(l));
    }
    return lines;
  }catch(e){ return null; }
}

async function readDay(dateStr){
  const blank = blankLines();
  const result = { lines: blank, sfer: {t1:0,t2:0,t3:0}, snapshots: {} };
  let all = {};
  try{ all = await Store.getMany(dayPrefix(dateStr)); }catch(e){ return result; }

  let byId = {};
  Object.keys(all).forEach(k=>{
    const m = k.match(/-line-(.+)$/);
    if(m){ try{ byId[m[1]] = JSON.parse(all[k]); result.snapshots[m[1]] = all[k]; }catch(e){} }
  });

  if(Object.keys(byId).length === 0){
    const migrated = await migrateV5IfNeeded(dateStr);
    if(migrated){
      migrated.forEach(l=>{ byId[l.id] = l; result.snapshots[l.id] = JSON.stringify(l); });
    }
  }

  result.lines = stripSublinhaPrefix(blank.map(l => byId[l.id] ? byId[l.id] : l));
  const sferRaw = all[sferKeyForDate(dateStr)];
  if(sferRaw){ try{ result.sfer = JSON.parse(sferRaw); }catch(e){} }
  return result;
}

async function loadState(){
  await ensureStoreHealthy();
  const r = await readDay(state.date);
  state.lines = r.lines;
  state.sferByShift = r.sfer;

  render();
}

// saveState(lineId) grava SÓ aquela linha (seguro para vários usuários).
// Sem argumento, grava todas — usado em reset/importação.
async function saveState(lineId){
  const targets = lineId ? state.lines.filter(l=>l.id===lineId) : state.lines;
  for(const l of targets){
    try{
      const payload = JSON.stringify(l);
      await Store.set(lineKey(state.date, l.id), payload);
      lineSnapshots[l.id] = payload;
    }catch(e){ console.error('Falha ao salvar a linha ' + l.id, e); }
  }
}

async function saveSfer(){
  try{

  }catch(e){ console.error('Falha ao salvar SFER', e); }
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getHours(line){
  if(state.currentShift==='day'){
    return [].concat(line.hoursByShift.t1, line.hoursByShift.t2, line.hoursByShift.t3);
  }
  return line.hoursByShift[state.currentShift];
}
function getPerdas(line){
  if(state.currentShift==='day'){
    return [].concat(line.perdasByShift.t1, line.perdasByShift.t2, line.perdasByShift.t3);
  }
  return line.perdasByShift[state.currentShift];
}

// aplica o filtro global (hora selecionada / status selecionado) sobre as horas de uma linha
function applyFilter(hours){
  let out = state.filter.hourIdx!=null ? [hours[state.filter.hourIdx]] : hours.slice();
  if(state.filter.status){
    out = out.filter(h => statusClass(h.prev, h.real) === state.filter.status);
  }
  return out;
}

function lineTotals(line){
  const hours = applyFilter(getHours(line));
  const passed = hours.filter(h => h && h.real > 0);
  const prevSum = passed.reduce((s,h)=>s+h.prev,0);
  const realSum = passed.reduce((s,h)=>s+h.real,0);
  return { prevSum, realSum, diff: prevSum - realSum };
}

function statusClass(prev, real){
  if(real<=0) return 'pending';
  const ratio = real/prev;
  if(ratio >= 0.97) return 'ok';
  if(ratio >= 0.85) return 'warn';
  return 'crit';
}

function getStockForShift(line){
  if(state.currentShift==='day'){
    return { inicial: line.stock.byShift.t1.inicial, final: line.stock.byShift.t3.final };
  }
  return line.stock.byShift[state.currentShift];
}

function stockStatus(stock, val){
  if(val < stock.min) return 'crit';
  if(val < stock.min*1.25) return 'warn';
  return 'ok';
}

function toggleHourFilter(idx){

function setStatusFilter(status){

  const mainSummaries = lines.filter(l=>l.principal).map(l=>{

  const anyFilter = state.filter.hourIdx!=null || state.filter.status || state.filter.motivo;

    ${activeHourLabel ? `<button class="chip active hour" onclick="toggleHourFilter(${state.filter.hourIdx})">Hora ${esc(activeHourLabel)} ✕</button>` : ''}
    ${state.filter.motivo ? `<button class="chip active motivo" onclick="setMotivoFilter('${esc(state.filter.motivo).replace(/'/g,"\\'")}')">Motivo: ${esc(state.filter.motivo)} ✕</button>` : ''}
    ${anyFilter ? `<button class="chip clear" onclick="clearFilters()">Limpar filtros</button>` : '<span class="filter-hint">clique numa barra do gráfico ou num status para filtrar tudo</span>'}
  </div>`;

  // Pareto de perdas: agrega minutos/qtd/ocorrências por motivo, somando todas as linhas do turno.
  // Já respeita o filtro de hora ativo (crossfilter): se uma hora estiver selecionada,
  // só entram perdas cujo bloco HxH corresponde àquela hora.
  const hourFilterLabel = state.filter.hourIdx!=null && lines.length ? getHours(lines[0])[state.filter.hourIdx].h : null;
  const paretoMap = {};
  lines.forEach(l=>{
    getPerdas(l).forEach(p=>{
      if(hourFilterLabel && p.hxh !== hourFilterLabel) return;
      const key = p.motivo || 'SEM MOTIVO';
      if(!paretoMap[key]) paretoMap[key] = {motivo:key, minutos:0, qtd:0, ocorrencias:0};
      paretoMap[key].minutos += Number(p.minutos||0);
      paretoMap[key].qtd += Number(p.qtd||0);
      paretoMap[key].ocorrencias += 1;
    });
  });
  const paretoList = Object.values(paretoMap).sort((a,b)=>b.minutos-a.minutos);
  const paretoTotalMin = paretoList.reduce((s,p)=>s+p.minutos,0);
  const paretoMaxMin = Math.max(...paretoList.map(p=>p.minutos), 1);
  let paretoAcum = 0;
  const paretoRows = paretoList.map(p=>{
    paretoAcum += p.minutos;
    const pct = paretoTotalMin>0 ? Math.round((p.minutos/paretoTotalMin)*100) : 0;
    const acumPct = paretoTotalMin>0 ? Math.round((paretoAcum/paretoTotalMin)*100) : 0;
    const barPct = Math.round((p.minutos/paretoMaxMin)*100);
    const isActive = state.filter.motivo === p.motivo;
    return `<div class="pareto-row ${isActive?'active':''}" onclick="setMotivoFilter('${esc(p.motivo).replace(/'/g,"\\'")}')" title="Clique para filtrar tudo por este motivo">
      <div class="pareto-label">${esc(p.motivo)} <span class="pareto-count">(${p.ocorrencias}x)</span></div>
      <div class="pareto-barwrap"><div class="pareto-bar" style="width:${barPct}%"></div></div>
      <div class="pareto-nums"><b>${p.minutos} min</b> · ${pct}% <span class="pareto-acum">acum. ${acumPct}%</span></div>
    </div>`;
  }).join('');
  const paretoPanel = paretoList.length ? `
    <div class="pareto-toggle-row">
      <button class="pareto-toggle-btn" onclick="togglePareto()">
        📊 Pareto de Perdas ${state.paretoOpen ? '▲ ocultar' : '▼ ver'}
      </button>
    </div>
    ${state.paretoOpen ? `
    <div class="pareto-panel">
      <div class="pareto-title">Pareto de Perdas — ${esc(shift.label)} (todas as linhas)${hourFilterLabel ? ' · filtrado pela hora '+esc(hourFilterLabel) : ''}</div>
      ${paretoRows}
    </div>` : ''}` : '';

  const cards = lines.map(line=>{
    const t = lineTotals(line);
    const hours = getHours(line);
    const perdas = getPerdas(line);
    const unit = line.unit || (line.principal ? 'CBR' : 'pç');
    const perdasQtd = perdas.reduce((s,p)=>s+Number(p.qtd||0),0);
    const justified = (perdasQtd >= t.diff && t.diff > 0) || t.diff<=0;
    const deltaClass = t.diff<=0 ? 'ok' : (t.diff <= t.prevSum*0.1 ? 'warn' : 'crit');
    const maxVal = Math.max(...hours.map(h=>Math.max(h.prev,h.real)), 1);

    // crossfilter: perdas desta linha que casam com a hora/motivo selecionados (para os contadores exploratórios)
    const perdasFiltered = perdas.filter(p=>{
      if(hourFilterLabel && p.hxh !== hourFilterLabel) return false;
      if(state.filter.motivo && p.motivo !== state.filter.motivo) return false;
      return true;
    });
    // horas desta linha que têm alguma perda batendo com o motivo selecionado (para marcar no gráfico)
    const motivoHxHSet = state.filter.motivo ? new Set(perdas.filter(p=>p.motivo===state.filter.motivo).map(p=>p.hxh)) : null;

    const bars = hours.map((h,i)=>{
      const prevH = Math.round((h.prev/maxVal)*100);
      const realH = h.real>0 ? Math.round((h.real/maxVal)*100) : 0;
      const cls = statusClass(h.prev, h.real);
      const isSelectedHour = state.filter.hourIdx===i;
      const matchesStatus = !state.filter.status || cls===state.filter.status;
      const matchesHour = state.filter.hourIdx==null || isSelectedHour;
      const matchesMotivo = !motivoHxHSet || motivoHxHSet.has(h.h);
      const dim = !(matchesStatus && matchesHour && matchesMotivo);
      return `<div class="hourcol ${isSelectedHour?'selected':''} ${dim?'dimmed':''}"
                   title="${esc(h.h)} · previsto ${h.prev} · realizado ${h.real} · clique para filtrar"
                   onclick="toggleHourFilter(${i})">
        <div class="bars">
          <div class="bar prev" style="height:${prevH}%"></div>
          <div class="bar real ${cls}" style="height:${cls==='pending'?2:realH}%"></div>
        </div>
        <div class="hourlabel">${h.h.split('–')[0]}</div>
      </div>`;
    }).join('');

    const stockBlock = line.principal ? '' : (()=>{
      const st = line.stock;
      const sh = getStockForShift(line);
      const scI = stockStatus(st, sh.inicial);
      const scF = stockStatus(st, sh.final);
      const delta = sh.final - sh.inicial;
      const deltaCls = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
      const deltaTxt = (delta > 0 ? '+' : '') + delta + ' pç';
      return `<div class="stockwrap">
        <span class="stocklabel">Estoque</span>
        <span class="stockpair">
          <span class="stockitem"><span class="stocktag">Inicial</span><span class="stocknum ${scI}">${sh.inicial} pç</span></span>
          <span class="stockitem"><span class="stocktag">Final</span><span class="stocknum ${scF}">${sh.final} pç</span></span>
          <span class="stockitem"><span class="stocktag">Delta</span><span class="stockdelta ${deltaCls}">${deltaTxt}</span></span>
        </span>
        <span class="stockmin">(mín. ${st.min})</span>
      </div>`;
    })();

    return `<div class="card">
      <div class="card-head">
        <div class="titles">
          <h3>${esc(line.name)}</h3>
          <span class="tag ${line.principal?'principal':'estoque'}">${line.principal?'Linha Principal':'Sublinha • Estoque'}</span>
          <span class="tag jph-tag">JPH ${line.targetPerHour}</span>
        </div>
        <button class="icon-btn" title="Editar dados" onclick="openModal('editar','${line.id}')">✎</button>
      </div>

      <div class="totals">
        <div class="block"><div class="label">Previsto</div><div class="value num">${t.prevSum} <span class="unit">${unit}</span></div></div>
        <div class="block"><div class="label">Realizado</div><div class="value num">${t.realSum} <span class="unit">${unit}</span></div></div>
        <div class="delta ${deltaClass}">${t.diff<=0?'Em dia':'−'+t.diff+' '+unit}</div>
      </div>
      <div class="stopped-min">⏱ ${perdasFiltered.reduce((s,p)=>s+Number(p.minutos||0),0)} min parado${anyFilter?' (filtrado)':' no turno'}</div>

      <div class="chart">${bars}</div>

      ${stockBlock}

      <div class="card-foot">
        <span class="justif ${justified?'done':''}">${
          t.diff<=0 ? 'Sem diferença a justificar' :
          justified ? `Diferença justificada (${perdasQtd} ${unit})` :
          `Faltam ${t.diff-perdasQtd} ${unit} para justificar`
        }</span>
        <button class="btn perdas" onclick="openModal('perdas','${line.id}')">
          Ver perdas ${perdas.length? `<span class="count-pill">${anyFilter?perdasFiltered.length+'/':''}${perdas.length}</span>` : ''}
        </button>
      </div>
    </div>`;
  }).join('');

  const modalHtml = state.modal ? renderModal() : '';

  app.innerHTML = `
    <header class="top">
      <div class="top-row">
        <div class="top-title">
          <h1>Painel de Produção — Chaparia</h1>
          <p class="sub">Gestão visual por linha · Previsto x Realizado hora a hora</p>
          <div class="date-field">
            <label for="panel-date">Data</label>
            <input type="date" id="panel-date" value="${state.date}" onchange="setDate(this.value)">
          </div>
        </div>
        <div class="brand">
          <img class="brand-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAADwAAAAMuCAYAAACkPfYPAADx4ElEQVR4nOzdd7ikd13//+emEFogSOi9o6j0Ik2KNAFFiog0Kxaw8BMRaSIiCn5FQCwgIkIoItIRkN5raFJCCR2kh5BK2vn9cS9f9xu2nDIzn5lzHo/r2ivL2XvenxfZszObc+Z1v3etra0FAAAAAAAAALBkLln9f9UdqitUZ1YfrI6qnlp9b1gydrLrNn1e3qK6cHVc9Zbqb6o3D8wFAAAAAABsM7sUgAEAAAAAAACAJXPb6vnV+ffx6x+qfrr6ysISQT2kekx18F5+ba366+rBu38OAAAAAACwJQrAAAAAAAAAAMAy+eHq6OpcB7juw9X1sgmYxfjV6unruO5h1WPnnAUAAAAAANgBFIABAAAAAAAAgGXysuqO67z2QU1bV2Gezld9vjpiHdeeVl2++vI8AwEAAAAAANvfQaMDAAAAAAAAAADsdr7qdhu4/lfnFQT2cJfWV/6tOkd1z/lFAQAAAAAAdgoFYAAAAAAAAABgWVy1OmSD1x8xnyjwf11vg9dfay4pAAAAAACAHUUBGAAAAAAAAABYFodu8Ppd1fnnEQT2cMQGrz/XPEIAAAAAAAA7iwIwAAAAAAAAALAsTt7g9WdW35pHENjDNzd4/efnkgIAAAAAANhRFIABAAAAAAAAgGVxbHXaBq5/b3XinLLA971hg9e/bi4pAAAAAACAHUUBGAAAAAAAAABYFt+tXryB6/9qXkFgDy+vPrnOa4+p/nOOWQAAAAAAgB1CARgAAAAAAAAAWCYPqv5nHdf9U/WiOWeBqjOqX2wqqO/PKdUv774eAAAAAABgSxSAAQAAAAAAAIBl8qXq5tUH9/Hr36seWf3mogJBdXR1s+rD+/j1L1e3q961qEAAAAAAAMD2tmttbW10BgAAAAAAAACAszuoun11q+qiTdtV31/9W/XVgbnY2Q6qbtP0eXnJ6uTqrdXzdv8cAAAAAABgJhSAAQAAAAAAAAAAAAAAAABgiRw0OgAAAAAAAAAAAAAAAAAAAPC/FIABAAAAAAAAAAAAAAAAAGCJKAADAAAAAAAAAAAAAAAAAMASUQAGAAAAAAAAAAAAAAAAAIAlogAMAAAAAAAAAAAAAAAAAABLRAEYAAAAAAAAAAAAAAAAAACWiAIwAAAAAAAAAAAAAAAAAAAsEQVgAAAAAAAAAAAAAAAAAABYIgrAAAAAAAAAAAAAAAAAAACwRBSAAQAAAAAAAAAAAAAAAABgiSgAAwAAAAAAAAAAAAAAAADAElEABgAAAAAAAAAAAAAAAACAJaIADAAAAAAAAAAAAAAAAAAAS0QBGAAAAAAAAAAAAAAAAAAAlogCMAAAAAAAAAAAAAAAAAAALBEFYAAAAAAAAAAAAAAAAAAAWCIKwAAAAAAAAAAAAAAAAAAAsEQUgAEAAAAAAAAAAAAAAAAAYIkoAAMAAAAAAAAAAAAAAAAAwBJRAAYAAAAAAAAAAAAAAAAAgCWiAAwAAAAAAAAAAAAAAAAAAEtEARgAAAAAAAAAAAAAAAAAAJaIAjAAAAAAAAAAAAAAAAAAACyRQ0YHAAAAAAAAAABg7n6oumh1werL1eerM4cmAgAAAAAAYJ8UgAEAAAAAAAAAtqdrVPeu7lhd6Wy/dlr1rup51Quqby80GQAAAAAAAPu1a21tbXQGAAAAAAAAAABm57LVX1Y/X+1ax/XHV39W/W1TMRgAAAAAAIDBFIABAAAAAAAAALaPm1UvrC64icceXf1M9ZVZBgIAAAAAAGDjFIABAAAAAAAAALaH21Yvqw7dwowvVz9VHTOTRAAAAAAAAGyKAjAAAAAAAAAAwOq7SvWu6ogZzPpUdf3quBnMAgAAAAAAYBMOGh0AAAAAAAAAAIAte2qzKf9WXan6pxnNAgAAAAAAYBNsAAY async function exportBackup(){
  let data = {};
  try{
    data = await Store.getMany(DATA_PREFIX);
  }catch(e){ /* sem list(): inclui pelo menos o dia aberto */ }
  // garante que o dia atualmente aberto sempre entra no backup
  state.lines.forEach(l => { data[lineKey(state.date, l.id)] = JSON.stringify(l); });
  data[sferKeyForDate(state.date)] = JSON.stringify(state.sferByShift);

  const payload = { exportedAt: new Date().toISOString(), version: 'v6', data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'chaparia-backup-' + state.date + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackupFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    let payload;
    try{
      payload = JSON.parse(e.target.result);
    }catch(err){
      alert('Arquivo inválido: não é um backup .json reconhecível.');
      return;
    }
    const data = payload && payload.data ? payload.data : null;
    if(!data){
      alert('Arquivo inválido: não contém dados de backup.');
      return;
    }
    let restored = 0, failed = 0;
    for(const key of Object.keys(data)){
      try{ await Store.set(key, data[key]); restored++; }
      catch(err){ failed++; }
    }
    // recarrega o dia aberto a partir do que acabou de ser gravado
    const r = await readDay(state.date);
    state.lines = r.lines;
    state.sferByShift = r.sfer;
    lineSnapshots = r.snapshots;
    render();
    alert('Backup carregado: ' + restored + ' registro(s) restaurado(s)' + (failed ? ', ' + failed + ' falharam.' : '.'));
  };
  reader.readAsText(file);
  inputEl.value = '';
}

function setShift(id){
  state.userPickedShift = true;
  state.currentShift = id;
  state.modal = null;
  state.filter = { hourIdx:null, status:null, motivo:null };
  render();
}

function findLine(id){ return state.lines.find(l=>l.id===id); }

function openModal(type, lineId){
  if(type==='editar' && state.currentShift==='day'){
    alert('Para editar Previsto, Realizado ou Estoque, selecione um turno específico (1°, 2° ou 3°). A visão "Dia Completo" é somente consulta.');
    return;
  }
  state.modal = { type, lineId };
  render();
}
function closeModal(){
  state.modal = null;
  state.prevUnlocked = {};
  state.prevPwdBarFor = null;
  state.stockUnlocked = {};
  state.stockPwdBarFor = null;
  render();
}

function renderModal(){
  const line = findLine(state.modal.lineId);
  if(!line) return '';
  if(state.modal.type==='perdas') return renderPerdasModal(line);
  return renderEditModal(line);
}

function renderPerdasModal(line){
  const t = lineTotals(line);
  const perdas = getPerdas(line);
  const unit = line.unit || (line.principal ? 'CBR' : 'pç');
  const perdasQtd = perdas.reduce((s,p)=>s+Number(p.qtd||0),0);
  const justified = t.diff<=0 || perdasQtd>=t.diff;
  const isDay = state.currentShift === 'day';
  const shiftLabel = isDay ? 'Dia Completo (1°+2°+3° turnos)' : SHIFTS.find(s=>s.id===state.currentShift).label;

  const rows = perdas.map((p,i)=>`
    <tr>
      <td class="num">${esc(p.horaInicio||p.hora||'—')}</td>
      <td class="num">${esc(p.horaFim||'—')}</td>
      <td class="num">${esc(p.hxh||'—')}</td>
      <td>${esc(p.motivo)}</td>
      <td class="num">${p.minutos||0} min</td>
      <td class="num">${p.qtd} ${unit}</td>
      <td>${isDay ? '' : `<button class="rm-btn" onclick="removePerda('${line.id}',${i})" title="Remover">✕</button>`}</td>
    </tr>`).join('') || `<tr><td colspan="7" style="color:var(--text-faint);">Nenhuma perda registrada nesta linha neste turno.</td></tr>`;

  const addFormOrNote = isDay ? `
      <div class="addrow-hint">Visão "Dia Completo" é somente consulta (soma dos 3 turnos). Para lançar ou remover uma perda, selecione o turno (1°, 2° ou 3°) em que ela ocorreu.</div>
  ` : `
      <div class="addrow">
        <div><label>Hora Inicial</label>
          <input type="time" id="np-inicio" oninput="updateAutoCalc('${line.id}')">
        </div>
        <div><label>Hora Final</label>
          <input type="time" id="np-fim" oninput="updateAutoCalc('${line.id}')">
        </div>
        <div style="flex:1; min-width:200px;"><label>Motivo</label>
          <input type="text" class="reason-input" id="np-motivo" placeholder="DESCREVA O MOTIVO"
                 oninput="this.value=this.value.toUpperCase()" style="text-transform:uppercase">
        </div>
        <div><label>Minutos (auto)</label>
          <input type="text" id="np-minutos" value="0 min" readonly
                 style="background:var(--panel-2); color:var(--text-dim); cursor:not-allowed;">
        </div>
        <div><label>Qtd ${unit} (auto)</label>
          <input type="text" id="np-qtd" value="0" readonly
                 style="background:var(--panel-2); color:var(--text-dim); cursor:not-allowed;">
        </div>
        <button class="addbtn" onclick="addPerda('${line.id}')">Adicionar perda</button>
      </div>
      <div class="addrow-hint">Se a parada atravessar mais de uma hora (ex: 08:50–09:05), ela é dividida automaticamente em uma linha por bloco HxH. A quantidade de cada trecho é calculada pelo JPH da linha (ritmo fixo), não pelo Previsto daquela hora.</div>
  `;

  return `<div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2>Perdas — ${esc(line.name)}</h2>
          <p class="sub">${esc(shiftLabel)} · registros que justificam a diferença entre previsto e realizado</p>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <table class="data">
        <thead><tr><th>Hora Inicial</th><th>Hora Final</th><th>HxH</th><th>Motivo</th><th>Minutos</th><th>Qtd</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>

      <div class="banner ${justified?'done':'pending'}">
        <span>Diferença a justificar: <b class="num">${Math.max(t.diff,0)} ${unit}</b></span>
        <span>Registrado: <b class="num">${perdasQtd} ${unit}</b></span>
      </div>

      ${addFormOrNote}
    </div>
  </div>`;
}

function renderEditModal(line){
  const hours = getHours(line);
  const shiftLabel = SHIFTS.find(s=>s.id===state.currentShift).label;
  const unlocked = !!state.prevUnlocked[line.id];

  const rows = hours.map((h,i)=>`
    <tr>
      <td class="num">${esc(h.h)}</td>
      <td><input type="number" min="0" value="${h.prev}" class="prev-locked" ${unlocked?'':'disabled'}

          <th>Hora</th>
          <th>Previsto
            <button class="lock-btn" onclick="togglePrevLock('${line.id}')" title="${unlocked?'Bloquear Previsto novamente':'Digitar senha para liberar edição'}">
              ${unlocked ? '🔓' : '🔒'}
            </button>
          </th>
          <th>Realizado</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${pwdBar}

      ${stockBlock}
    </div>
  </div>`;
}

function togglePrevLock(lineId){
  if(state.prevUnlocked[lineId]){
    // já desbloqueado: clicar tranca de novo
    delete state.prevUnlocked[lineId];
    state.prevPwdBarFor = null;
    render();
  } else {
    // ainda travado: abre a barra de senha (ou fecha se já estiver aberta)
    state.prevPwdBarFor = (state.prevPwdBarFor === lineId) ? null : lineId;
    render();
  }
}

// divide uma parada em uma entrada por bloco HxH que ela atravessa,
// cada uma usando o JPH (ritmo fixo) da linha
function splitPerdaAcrossBuckets(line, inicioStr, fimStr){
  const shift = SHIFTS.find(s=>s.id===state.currentShift);
  if(!shift) return [];
  const shiftStartAbs = timeToMinutes(shift.start);

  let rawStart = timeToMinutes(inicioStr);
  let rawEnd = timeToMinutes(fimStr);
  if(rawEnd <= rawStart) rawEnd += 1440; // parada cruza a meia-noite
  const duration = rawEnd - rawStart;

  let adjStart = rawStart < shiftStartAbs ? rawStart + 1440 : rawStart;
  const adjEnd = adjStart + duration;

  const buckets = genBuckets(shift.start, shift.end);
  const entries = [];

  for(let i=0;i<buckets.length;i++){
    const b = buckets[i];
    const overlapStart = Math.max(adjStart, b.from);
    const overlapEnd = Math.min(adjEnd, b.to);
    if(overlapEnd > overlapStart){
      const overlapMin = overlapEnd - overlapStart;
      // quantidade baseada no JPH (ritmo fixo da linha), não no Previsto daquela hora específica
      const qtd = line.targetPerHour>0 ? Math.ceil((overlapMin / 60) * line.targetPerHour) : 0;
      entries.push({
        horaInicio: minutesToLabel(overlapStart),
        horaFim: minutesToLabel(overlapEnd),
        hxh: b.label,
        minutos: overlapMin,
        qtd
      });
    }
  }
  return entries;
}

function updateAutoCalc(lineId){
  const line = findLine(lineId);
  const inicioEl = document.getElementById('np-inicio');
  const fimEl = document.getElementById('np-fim');
  const minEl = document.getElementById('np-minutos');
  const qtdEl = document.getElementById('np-qtd');
  if(!inicioEl || !fimEl || !minEl || !qtdEl) return;
  if(!inicioEl.value || !fimEl.value){ minEl.value = '0 min'; qtdEl.value = '0'; return; }
  const entries = splitPerdaAcrossBuckets(line, inicioEl.value, fimEl.value);
  const totalMin = entries.reduce((s,e)=>s+e.minutos,0);
  const totalQtd = entries.reduce((s,e)=>s+e.qtd,0);
  minEl.value = totalMin + ' min' + (entries.length>1 ? ' (dividido em '+entries.length+' horas)' : '');
  qtdEl.value = totalQtd;
}

function addPerda(lineId){
  const line = findLine(lineId);
  const inicio = document.getElementById('np-inicio').value;
  const fim = document.getElementById('np-fim').value;
  const motivo = document.getElementById('np-motivo').value.trim().toUpperCase();
  if(!inicio || !fim){ alert('Informe o início e o fim da parada.'); return; }
  if(!motivo){ alert('Informe o motivo da parada.'); return; }
  const entries = splitPerdaAcrossBuckets(line, inicio, fim);
  const totalQtd = entries.reduce((s,e)=>s+e.qtd,0);
  if(entries.length===0 || totalQtd<=0){ alert('O intervalo informado não gerou perda de quantidade — verifique os horários.'); return; }
  const perdas = getPerdas(line);
  entries.forEach(e => perdas.push({ horaInicio:e.horaInicio, horaFim:e.horaFim, hxh:e.hxh, motivo, minutos:e.minutos, qtd:e.qtd }));
  saveState(lineId);
  state.modal = {type:'perdas', lineId};
  render();
}

function removePerda(lineId, idx){
  if(state.currentShift==='day'){ alert('Selecione um turno específico para remover uma perda.'); return; }
  const line = findLine(lineId);
  getPerdas(line).splice(idx,1);
  saveState(lineId);
  state.modal = {type:'perdas', lineId};
  render();
}

const POLL_INTERVAL_MS = 6000;
const ROLLOVER_CHECK_MS = 60000;

// Sincronização multiusuário: relê o dia e atualiza SÓ as linhas que
// mudaram no servidor, preservando o que o usuário local está vendo.
async function pollForUpdates(){
  if(state.modal) return; // não interrompe quem está lançando algo
  if(document.hidden) return; // aba minimizada/em segundo plano: não consome tráfego
  try{
    const all = await Store.getMany(dayPrefix(state.date));
    let changed = false;
    Object.keys(all).forEach(k=>{
      const m = k.match(/-line-(.+)$/);
      if(!m) return;
      const id = m[1];
      if(all[k] !== lineSnapshots[id]){
        const idx = state.lines.findIndex(l=>l.id===id);
        if(idx >= 0){
          try{
            state.lines[idx] = JSON.parse(all[k]);
            lineSnapshots[id] = all[k];
            changed = true;
          }catch(e){}
        }
      }
    });
    const sferRaw = all[sferKeyForDate(state.date)];
    if(sferRaw && sferRaw !== JSON.stringify(state.sferByShift)){
      try{ state.sferByShift = JSON.parse(sferRaw); changed = true; }catch(e){}
    }
    if(changed) render();
  }catch(e){ /* silencioso: tenta de novo no próximo ciclo */ }
}

// Vira sozinho para o dia/turno de produção corrente (regra do 3° turno incluída),
// sem atropelar quem escolheu manualmente outra data/turno para consultar.
async function checkProductionRollover(){
  if(state.modal) return;
  const cur = getProductionDayAndShift();
  if(!state.userPickedDate && cur.date !== state.date){
    state.date = cur.date;
    state.currentShift = cur.shift;
    state.filter = { hourIdx:null, status:null, motivo:null };
    await loadState();
    return;
  }
  if(!state.userPickedShift && !state.userPickedDate && cur.shift !== state.currentShift){
    state.currentShift = cur.shift;
    render();
  }
}

function startPolling(){
  setInterval(pollForUpdates, POLL_INTERVAL_MS);
  setInterval(checkProductionRollover, ROLLOVER_CHECK_MS);
}

loadState().then(()=>{ startPolling(); });
</script>
